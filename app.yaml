name: Self-Documenting Workshop
description: "Passive observer agent that watches a maker's bench and produces build artefacts"
icon: "\U0001F4F7"
ports: []
bricks:
  - "arduino:web_ui":
      assets_dir_path: /app/assets

# NOTE on secrets: App Lab CLI 0.9.0 silently ignores a top-level
# environment: block here, and bricks like cloud_llm expect their secrets
# to be set via the App Lab GUI's Brick Configuration panel. We use the
# raw anthropic SDK (for Sonnet 4.6 + vision + Opus 4.7), so we sidestep
# both: main.py reads .secrets.env at startup and pushes ANTHROPIC_API_KEY
# into the process environment. See README for setup.
